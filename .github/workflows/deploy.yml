name: CI/CD - Test, Build, Push, Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt httpx

      - name: Run tests
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          print('Health check passed.')
          "

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest
            docker stop task-manager-api || true
            docker rm task-manager-api || true
            docker run -d --name task-manager-api -p 80:8000 --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest
